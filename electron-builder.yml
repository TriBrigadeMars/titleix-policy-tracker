appId: org.titleixpolicytracker.desktop
productName: Title IX Policy Tracker

directories:
  output: dist-desktop
  buildResources: build

files:
  # Only the compiled main/preload process code plus the offline fallback page
  # (copied into electron-dist/ by desktop:copy-assets) ship. The Next.js app
  # in src/, prisma/, .next/ and every .env* file stay out.
  - electron-dist/**/*
  - package.json
  - "!node_modules/**/*"
  - "!src/**/*"
  - "!prisma/**/*"
  - "!.next/**/*"
  - "!.env*"

win:
  target:
    - nsis
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Title IX Policy Tracker

artifactName: "TitleIX-Policy-Tracker-Setup-${version}.${ext}"