name: CI

on:
  push:
    branches: [main, "tribrigademars-*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/titleix_test
      AUTH_SECRET: ci-auth-secret
      AUTH_GOOGLE_ID: dummy
      AUTH_GOOGLE_SECRET: dummy
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: titleix_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run db:generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # TEST_DATABASE_URL turns on the Postgres-backed integration tests; without
      # it they skip so `npm test` works on a machine with no database.
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/titleix_test
