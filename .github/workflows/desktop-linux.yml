name: Desktop Linux (AppImage, Arch, Ubuntu, Fedora & Rust Gate)

on:
  push:
    branches: [main, "tribrigademars-*"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  electron-linux:
    name: Electron Linux (AppImage + pacman/deb/rpm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install system packaging tools (rpm, squashfs, fuse)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm squashfs-tools libfuse2t64 libarchive-tools

      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run desktop:typecheck
      - run: npm test
      - run: npm run desktop:dist:linux

      - name: Audit packaged bundle for leaked secrets
        run: |
          ! find dist-desktop/linux-unpacked -name ".env*" | grep -q .

      - name: Upload downloadable AppImage & distro packages
        uses: actions/upload-artifact@v4
        with:
          name: titleix-linux-electron-packages
          path: |
            dist-desktop/*.AppImage
            dist-desktop/*.deb
            dist-desktop/*.rpm
            dist-desktop/*.pacman

  rust-tauri-linux:
    name: Rust / Tauri v2 Shell (Check, Test & AppImage Gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install WebKit2GTK 4.1 & libsecret dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libsecret-1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            dpkg-dev \
            rpm

      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
      - run: npm run desktop:stage-local

      - name: Run Rust shell unit tests (security, constants, window_state, uds_proxy)
        working-directory: src-tauri
        run: cargo test

      - name: Build Rust / Tauri Linux bundles (AppImage, deb, rpm)
        env:
          # linuxdeploy bundles binutils 2.35 strip, which exits on Ubuntu 24.04
          # glibc RELR sections (.relr.dyn). At the default log level Tauri
          # discards that stderr and reports only "failed to run linuxdeploy".
          NO_STRIP: "true"
        run: |
          # Next's standalone trace copies sharp-linux-x64.node out of its
          # package. linuxdeploy follows that addon and cannot see the
          # vendored libvips it links against unless this directory is on
          # the library path.
          vips_lib="${GITHUB_WORKSPACE}/node_modules/@img/sharp-libvips-linux-x64/lib"
          if ! compgen -G "${vips_lib}/libvips-cpp.so*" > /dev/null; then
            echo "Vendored libvips not found at ${vips_lib}" >&2
            exit 1
          fi
          export LD_LIBRARY_PATH="${vips_lib}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          npm run tauri:build -- --verbose

      - name: Upload Rust / Tauri AppImage & distro packages
        uses: actions/upload-artifact@v4
        with:
          name: titleix-linux-tauri-packages
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
