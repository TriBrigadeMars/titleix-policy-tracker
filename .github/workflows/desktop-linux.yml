name: Desktop Linux (AppImage, Arch, Ubuntu, Fedora & Rust Gate)

on:
  push:
    branches: [main, "tribrigademars-*"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  electron-linux:
    name: Electron Linux (AppImage + pacman/deb/rpm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install system packaging tools (rpm, squashfs, fuse)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm squashfs-tools libfuse2t64 libarchive-tools

      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run desktop:typecheck
      - run: npm test
      - run: npm run desktop:dist:linux

      - name: Audit packaged bundle for leaked secrets
        run: |
          ! find dist-desktop/linux-unpacked -name ".env*" | grep -q .

      - name: Upload downloadable AppImage & distro packages
        uses: actions/upload-artifact@v4
        with:
          name: titleix-linux-electron-packages
          path: |
            dist-desktop/*.AppImage
            dist-desktop/*.deb
            dist-desktop/*.rpm
            dist-desktop/*.pacman

  rust-tauri-linux:
    name: Rust / Tauri v2 Shell (Check, Test & AppImage Gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install WebKit2GTK 4.1 & libsecret dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libsecret-1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2t64 \
            rpm

      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
      - run: npm run desktop:stage-local

      - name: Run Rust shell unit tests (security, constants, window_state, uds_proxy)
        working-directory: src-tauri
        run: cargo test

      - name: Build Rust / Tauri Linux bundles (AppImage, deb, rpm)
        env:
          # linuxdeploy ships as an AppImage; the runner has no working FUSE
          # mount (libfuse2t64 brings the library, not fusermount), so let
          # AppImages extract themselves instead of mounting.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri:build

      - name: Upload Rust / Tauri AppImage & distro packages
        uses: actions/upload-artifact@v4
        with:
          name: titleix-linux-tauri-packages
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
